name: Daily digest
on:
  schedule:
    - cron: '47 2 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Digest profile
        type: choice
        options: [executive, technical]
        default: executive
permissions:
  contents: read
concurrency:
  group: daily-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STORAGE_BACKEND: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      PROFILE: ${{ inputs.profile || 'executive' }}
      MAX_ARTICLES_PER_RUN: '20'
      MAX_ENTRIES_PER_FEED: '5'
      MAX_AI_CALLS_PER_RUN: '20'
      APP_TIMEZONE: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - name: Generate and persist digest
        run: python main.py --profile "$PROFILE" --output-dir digests
      - name: Save exports
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: digests/
          retention-days: 7
          if-no-files-found: error
